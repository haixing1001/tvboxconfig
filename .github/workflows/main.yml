name: Sync with Upstream
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0:00 运行
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # 必须在仓库 Settings -> Secrets 中配置
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull upstream and rebase
        run: |
          # 添加上游仓库地址
          git remote add upstream https://github.com/qist/tvbox
          
          # 获取上游更新
          git fetch upstream
          
          # 将你的修改变基到上游的最新代码之上
          # 使用 -X theirs 策略：当发生冲突时，自动保留你自己的修改覆盖上游
          # 注意：如果你的主分支名叫 main，请将 master 替换为 main
          git rebase -X theirs upstream/master
          
          # 强制推送以更新历史记录
          git push origin master -f
